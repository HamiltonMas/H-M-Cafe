<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Table — H&M Cafe</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.0.0/css/line.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="menucss.css" />
    <link rel="stylesheet" href="new1Style.css" />
    <link rel="stylesheet" href="cart.css" />
    <link rel="stylesheet" href="css/features.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body class="reserve-page">
    <header class="site-header">
      <div class="container">
        <div class="row">
          <div class="col-lg-2">
            <div class="header-logo">
              <a href="index.html"
                ><h2><span>H&M</span> Cafe</h2></a
              >
            </div>
          </div>
          <div class="col-lg-10">
            <div class="main-navigation">
              <button class="menu-toggle"><span></span><span></span></button>
              <nav class="header-menu">
                <ul class="menu food-nav-menu">
                  <li><a href="index.html">Home</a></li>
                  <li><a href="AboutUs.html">About</a></li>
                  <li><a href="Menu.html">Menu</a></li>
                  <li>
                    <a href="Reservations.html" class="active-menu">Reserve</a>
                  </li>
                  <li><a href="Gallery.html">Gallery</a></li>
                  <li><a href="Orders.html">Orders</a></li>
                </ul>
              </nav>
              <div class="header-right">
                <form
                  action="Menu.html"
                  method="GET"
                  class="header-search-form for-des"
                >
                  <input
                    type="search"
                    name="q"
                    class="form-input"
                    placeholder="Search dishes..."
                  />
                  <button type="submit" aria-label="Search">
                    <i class="uil uil-search"></i>
                  </button>
                </form>
                <a
                  href="#"
                  class="header-btn header-cart"
                  id="cartBtn"
                  role="button"
                  aria-label="Cart"
                >
                  <i class="uil uil-shopping-bag"></i>
                </a>
                <a href="Profile.html" class="header-btn"
                  ><i class="uil uil-user-md"></i
                ></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <section class="reserve-page">
      <div class="reserve-hero">
        <h1>Book a Table</h1>
        <p>Reserve your spot — we'll confirm your booking within minutes.</p>
      </div>

      <div class="reserve-card">
        <form id="reserveForm" class="reserve-form">
          <div class="full">
            <label>Full Name</label>
            <input
              type="text"
              name="name"
              required
              placeholder="e.g. Thabo Mokoena"
            />
          </div>
          <div>
            <label>Phone</label>
            <input
              type="tel"
              name="phone"
              required
              placeholder="072 924 2639"
            />
          </div>
          <div>
            <label>Guests</label>
            <select name="guests" required>
              <option value="1">1 guest</option>
              <option value="2" selected>2 guests</option>
              <option value="3">3 guests</option>
              <option value="4">4 guests</option>
              <option value="5">5 guests</option>
              <option value="6">6 guests</option>
              <option value="8">8 guests</option>
              <option value="10">10+ guests</option>
            </select>
          </div>
          <div>
            <label>Date</label>
            <input type="date" name="date" required />
          </div>
          <div>
            <label>Time</label>
            <select name="time" required>
              <option value="09:00">09:00</option>
              <option value="10:00">10:00</option>
              <option value="11:00">11:00</option>
              <option value="12:00" selected>12:00</option>
              <option value="13:00">13:00</option>
              <option value="14:00">14:00</option>
              <option value="15:00">15:00</option>
              <option value="16:00">16:00</option>
              <option value="17:00">17:00</option>
              <option value="18:00">18:00</option>
              <option value="19:00">19:00</option>
            </select>
          </div>
          <div class="full">
            <label>Special Requests (optional)</label>
            <textarea
              name="notes"
              placeholder="Birthday, allergies, high chair, etc."
            ></textarea>
          </div>
          <button type="submit" class="reserve-submit">
            Confirm Reservation
          </button>
        </form>

        <div id="reserveConfirm" class="reserve-confirm">
          <i class="uil uil-check-circle"></i>
          <h3>Reservation Confirmed!</h3>
          <p>
            <strong>Reference:</strong> <span class="rc-id"></span><br />
            <strong>Date:</strong> <span class="rc-date"></span><br />
            <strong>Time:</strong> <span class="rc-time"></span><br />
            <strong>Guests:</strong> <span class="rc-guests"></span>
          </p>
          <p>We've saved your booking. See you soon!</p>
          <a
            href="index.html"
            style="
              display: inline-block;
              padding: 12px 28px;
              background: linear-gradient(145deg, #ffc954, #ffbc00);
              color: #fff;
              border-radius: 30px;
              text-decoration: none;
              font-weight: 700;
              margin-top: 10px;
            "
          >
            Back to Home
          </a>
        </div>
      </div>
    </section>

    <script src="js/jquery-3.5.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/font-awesome.min.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/jquery.mixitup.min.js"></script>
    <script src="js/jquery.fancybox.min.js"></script>
    <script src="js/parallax.min.js"></script>
    <script src="js/gsap.min.js"></script>
    <script src="js/ScrollTrigger.min.js"></script>
    <script src="js/ScrollToPlugin.min.js"></script>
    <script src="main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/features.js"></script>
    <script src="js/reservations.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/pwa.js"></script>
  </body>
</html>
