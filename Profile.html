<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - H&M Cafe</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="swiper-bundle.min.css" />
    <link rel="stylesheet" href="jquery.fancybox.min.css" />
    <link rel="stylesheet" href="menucss.css" />
    <link rel="stylesheet" href="new1Style.css" />
    <link rel="stylesheet" href="cart.css" />
    <link rel="stylesheet" href="css/features.css" />
    <link rel="manifest" href="manifest.json" />
    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.0.0/css/line.css"
    />
    <link rel="stylesheet" href="css/features.css" />
    <link rel="manifest" href="manifest.json" />
    <style>
      body.profile-page {
        background: #f8f8f8;
        padding-top: 100px;
        min-height: 100vh;
      }

      .profile-container {
        max-width: 600px;
        margin: 0 auto 60px;
        background: white;
        padding: 50px 40px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .profile-avatar {
        font-size: 100px;
        color: #ffc933;
        margin-bottom: 20px;
        display: inline-block;
      }

      .profile-field {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        padding: 18px 15px;
        margin: 5px 0;
        flex-wrap: wrap;
      }

      .profile-field i {
        font-size: 26px;
        color: #ffc933;
      }

      .profile-field h3 {
        font-size: 18px;
        color: #333;
        margin: 0;
        font-weight: 500;
        word-break: break-word;
      }

      .profile-line {
        height: 2px;
        background: linear-gradient(90deg, transparent, #ffc933, transparent);
        margin: 15px 0;
        width: 100%;
      }

      .profile-footer {
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid #eee;
        color: #888;
        font-size: 14px;
      }

      @media (max-width: 600px) {
        body.profile-page {
          padding-top: 90px;
        }
        .profile-container {
          margin: 0 15px 40px;
          padding: 35px 20px;
        }
        .profile-avatar {
          font-size: 80px;
        }
        .profile-field h3 {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body class="profile-page">
    <header class="site-header">
      <div class="container">
        <div class="row">
          <div class="col-lg-2">
            <div class="header-logo">
              <a href="index.html">
                <h2><span>H&M</span> Cafe</h2>
              </a>
            </div>
          </div>
          <div class="col-lg-10">
            <div class="main-navigation">
              <button class="menu-toggle"><span></span><span></span></button>
              <nav class="header-menu">
                <ul class="menu food-nav-menu">
                  <li><a href="index.html">Home</a></li>
                  <li><a href="AboutUs.html">About</a></li>
                  <li><a href="Menu.html">Menu</a></li>
                  <li><a href="Reservations.html">Reserve</a></li>
                  <li><a href="Gallery.html">Gallery</a></li>
                  <li><a href="Orders.html">Orders</a></li>
                </ul>
              </nav>
              <div class="header-right">
                <form action="#" class="header-search-form for-des">
                  <input
                    type="search"
                    class="form-input"
                    placeholder="Search Here..."
                  />
                  <button type="submit">
                    <i class="uil uil-search"></i>
                  </button>
                </form>
                <a
                  href="#"
                  class="header-btn header-cart"
                  id="cartBtn"
                  role="button"
                  aria-label="Open cart"
                >
                  <i class="uil uil-shopping-bag"></i>
                </a>
                <a href="Profile.html" class="header-btn">
                  <i class="uil uil-user-md"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="profile-container">
      <i class="bx bxs-user profile-avatar"></i>

      <div class="profile-field">
        <i class="bx bxs-user-circle"></i>
        <h3 id="username">Guest User</h3>
      </div>

      <div class="profile-line"></div>

      <div class="profile-field">
        <i class="bx bxs-envelope"></i>
        <h3 id="email">guest@hmcafe.com</h3>
      </div>

      <div class="profile-line"></div>

      <div class="profile-field">
        <i class="bx bxs-phone-call"></i>
        <h3 id="phone">+27- 722265926</h3>
      </div>

      <div class="profile-footer">
        <p>&copy; 2024 H&M Cafe - Cookies, Privacy and Terms</p>
      </div>
    </div>

    <script src="js/jquery-3.5.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/font-awesome.min.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/jquery.mixitup.min.js"></script>
    <script src="js/jquery.fancybox.min.js"></script>
    <script src="js/parallax.min.js"></script>
    <script src="js/gsap.min.js"></script>
    <script src="js/ScrollTrigger.min.js"></script>
    <script src="js/ScrollToPlugin.min.js"></script>
    <script src="main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/features.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/pwa.js"></script>
  </body>
</html>
