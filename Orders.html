<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders — H&M Cafe</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.0.0/css/line.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="menucss.css" />
    <link rel="stylesheet" href="new1Style.css" />
    <link rel="stylesheet" href="cart.css" />
    <link rel="stylesheet" href="css/features.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body class="orders-page">
    <header class="site-header">
      <div class="container">
        <div class="row">
          <div class="col-lg-2">
            <div class="header-logo">
              <a href="index.html"
                ><h2><span>H&M</span> Cafe</h2></a
              >
            </div>
          </div>
          <div class="col-lg-10">
            <div class="main-navigation">
              <button class="menu-toggle"><span></span><span></span></button>
              <nav class="header-menu">
                <ul class="menu food-nav-menu">
                  <li><a href="index.html">Home</a></li>
                  <li><a href="AboutUs.html">About</a></li>
                  <li><a href="Menu.html">Menu</a></li>
                  <li><a href="Reservations.html">Reserve</a></li>
                  <li><a href="Gallery.html">Gallery</a></li>
                  <li><a href="Orders.html" class="active-menu">Orders</a></li>
                </ul>
              </nav>
              <div class="header-right">
                <form
                  action="Menu.html"
                  method="GET"
                  class="header-search-form for-des"
                >
                  <input
                    type="search"
                    name="q"
                    class="form-input"
                    placeholder="Search dishes..."
                  />
                  <button type="submit" aria-label="Search">
                    <i class="uil uil-search"></i>
                  </button>
                </form>
                <a
                  href="#"
                  class="header-btn header-cart"
                  id="cartBtn"
                  role="button"
                  aria-label="Cart"
                >
                  <i class="uil uil-shopping-bag"></i>
                </a>
                <a href="Profile.html" class="header-btn"
                  ><i class="uil uil-user-md"></i
                ></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <section class="orders-page">
      <div class="orders-hero">
        <h1>My Orders</h1>
        <p>Track your past orders and reorder favourites in one click.</p>
      </div>
      <div class="orders-list" id="ordersList"></div>
    </section>

    <script src="js/jquery-3.5.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/font-awesome.min.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/jquery.mixitup.min.js"></script>
    <script src="js/jquery.fancybox.min.js"></script>
    <script src="js/parallax.min.js"></script>
    <script src="js/gsap.min.js"></script>
    <script src="js/ScrollTrigger.min.js"></script>
    <script src="js/ScrollToPlugin.min.js"></script>
    <script src="main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/features.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/pwa.js"></script>
  </body>
</html>
